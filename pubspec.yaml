name: easy_ride
description: EasyRide - Hybrid Bus Ticketing System for APSRTC
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.6.0

  # State Management
  provider: ^6.1.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

  # Local Storage
  shared_preferences: ^2.2.2

  # Charts
  fl_chart: ^0.65.0

  # Internationalization
  intl: ^0.20.2

  # UI Components
  cupertino_icons: ^1.0.2
  
  # Fonts & Typography
  google_fonts: ^6.1.0
  
  # Animations & Effects
  animate_do: ^3.1.2
  lottie: ^3.1.2
  
  # Glass morphism effect
  glassmorphism: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  image: "assets/images/app_logo.png"
  android_12:
    color: "#000000"
    image: "assets/images/app_logo.png"

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/localization/
    - assets/data/

  # Fonts (Optional - using default Material fonts)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
